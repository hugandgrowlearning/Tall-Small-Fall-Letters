<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Tall, Small & Fall Letters</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8f5ef;
    color: #3f3f3f;
    overflow-x: hidden;
}

header {
    text-align: center;
    padding: 24px 20px 8px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.subtitle {
    margin-top: 7px;
    color: #777;
    font-size: 17px;
}

/* =========================================
   MAIN GAME
========================================= */

.game {
    width: min(1150px, 95%);
    margin: 20px auto;

    display: grid;
    grid-template-columns: 1fr 250px;
    gap: 25px;
    align-items: stretch;
}

/* =========================================
   PAPER CARD
========================================= */

.paper-card {
    background: white;
    border-radius: 22px;
    padding: 28px;

    box-shadow: 0 6px 18px rgba(0,0,0,.08);
}

.instruction {
    text-align: center;
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 22px;
}

/* =========================================
   WRITING PAPER
========================================= */

#paper {
    position: relative;

    width: 100%;
    height: 440px;

    background: white;

    border: 3px solid #ece8df;
    border-radius: 16px;

    overflow: hidden;
    touch-action: none;
}

/*
    TOP LINE
*/

.top-line {
    position: absolute;

    left: 0;
    right: 0;

    top: 60px;

    height: 3px;

    background: #bfc3c5;
}

/*
    MIDDLE / SMALL-LETTER TOP LINE
*/

.middle-line {
    position: absolute;

    left: 0;
    right: 0;

    top: 200px;

    border-top: 3px dashed #bfc3c5;

    z-index: 3;
}

/*
    YELLOW SMALL-LETTER AREA
*/

.small-zone {
    position: absolute;

    left: 0;
    right: 0;

    top: 200px;
    height: 115px;

    background: rgba(255, 216, 74, .32);

    z-index: 1;
}

/*
    YELLOW BASELINE
*/

.baseline {
    position: absolute;

    left: 0;
    right: 0;

    top: 315px;

    height: 6px;

    background: #f2c94c;

    z-index: 4;
}

/* =========================================
   OPTIONAL SUBTLE LABELS
========================================= */

.zone-label {
    position: absolute;

    left: 15px;

    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;

    opacity: .20;

    pointer-events: none;

    z-index: 2;
}

.tall-label {
    top: 120px;
}

.small-label {
    top: 245px;
}

.fall-label {
    top: 370px;
}

/* =========================================
   RIGHT LETTER PANEL
========================================= */

.letter-panel {
    background: #e7f1ed;

    border-radius: 22px;

    padding: 25px 15px;

    box-shadow: 0 6px 18px rgba(0,0,0,.07);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    min-height: 440px;
}

.letter-panel h2 {
    margin: 0 0 35px;

    font-size: 18px;

    color: #666;
}

/* =========================================
   DRAGGABLE LETTER

   NO WHITE BACKGROUND
   NO BOX
========================================= */

#letter {
    font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;

    /*
       Large enough to visually fit
       the handwriting lines.
    */

    font-size: 155px;

    line-height: .85;

    font-weight: bold;

    color: #444;

    cursor: grab;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    /*
       Transparent — letter only!
    */

    background: transparent;

    border: none;
    box-shadow: none;

    padding: 10px 20px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    position: relative;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

#letter:hover {
    transform: scale(1.04);
}

#letter.dragging {
    cursor: grabbing;

    transform: scale(1.06);

    opacity: .88;

    z-index: 1000;
}

/* =========================================
   FEEDBACK
========================================= */

#feedback {
    margin-top: 30px;

    min-height: 35px;

    text-align: center;

    font-size: 22px;
    font-weight: bold;
}

.correct {
    color: #4b8b68;
}

.wrong {
    color: #d27765;
}

/* =========================================
   BUTTONS
========================================= */

.buttons {
    width: min(1100px, 95%);

    margin: 0 auto 30px;

    display: flex;

    justify-content: center;

    gap: 14px;
}

button {
    border: none;

    border-radius: 14px;

    padding: 13px 24px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background: #f2c94c;

    color: #3d3d3d;

    box-shadow: 0 4px 0 #d5ac35;
}

button:active {
    transform: translateY(3px);

    box-shadow: 0 1px 0 #d5ac35;
}

/* =========================================
   CONFETTI
========================================= */

.confetti {
    position: fixed;

    width: 10px;
    height: 10px;

    border-radius: 3px;

    pointer-events: none;

    z-index: 9999;

    animation: fall 1.2s ease-out forwards;
}

@keyframes fall {

    0% {
        transform:
            translateY(-20px)
            rotate(0deg);

        opacity: 1;
    }

    100% {
        transform:
            translateY(400px)
            rotate(500deg);

        opacity: 0;
    }
}

/* =========================================
   TABLET / PHONE
========================================= */

@media (max-width: 760px) {

    h1 {
        font-size: 25px;
    }

    .game {
        grid-template-columns: 1fr;
    }

    .letter-panel {
        min-height: 210px;
    }

    .letter-panel h2 {
        margin-bottom: 15px;
    }

    #letter {
        font-size: 130px;
    }
}

</style>
</head>

<body>

<header>

    <h1>
        Tall, Small & Fall Letters
    </h1>

    <div class="subtitle">
        Where does the letter belong?
    </div>

</header>


<div class="game">

    <!-- =====================================
         WRITING PAPER
    ====================================== -->

    <div class="paper-card">

        <div class="instruction">
            Drag the letter to the correct place on the writing paper.
        </div>

        <div id="paper">

            <div class="top-line"></div>

            <div class="small-zone"></div>

            <div class="middle-line"></div>

            <div class="baseline"></div>

            <div class="zone-label tall-label">
                TALL
            </div>

            <div class="zone-label small-label">
                SMALL
            </div>

            <div class="zone-label fall-label">
                FALL
            </div>

        </div>

    </div>


    <!-- =====================================
         RANDOM LETTER
    ====================================== -->

    <div class="letter-panel">

        <h2>
            Drag this letter
        </h2>

        <div id="letter">
            a
        </div>

        <div id="feedback"></div>

    </div>

</div>


<div class="buttons">

    <button onclick="newLetter()">
        New Letter
    </button>

    <button onclick="resetLetter()">
        Reset
    </button>

</div>


<script>

/* =========================================
   LETTER GROUPS
========================================= */

const tallLetters = [
    "b",
    "d",
    "f",
    "h",
    "k",
    "l",
    "t"
];


const smallLetters = [
    "a",
    "c",
    "e",
    "i",
    "m",
    "n",
    "o",
    "r",
    "s",
    "u",
    "v",
    "w",
    "x",
    "z"
];


const fallLetters = [
    "g",
    "j",
    "p",
    "q",
    "y"
];


const allLetters = [
    ...tallLetters,
    ...smallLetters,
    ...fallLetters
];


/* =========================================
   ELEMENTS
========================================= */

const letter =
    document.getElementById("letter");

const paper =
    document.getElementById("paper");

const feedback =
    document.getElementById("feedback");

const panel =
    document.querySelector(".letter-panel");


let currentLetter = "a";

let dragging = false;

let offsetX = 0;
let offsetY = 0;


/* =========================================
   RANDOM LETTER
========================================= */

function newLetter() {

    let next;

    do {

        next =
            allLetters[
                Math.floor(
                    Math.random()
                    * allLetters.length
                )
            ];

    }
    while (
        next === currentLetter
    );


    currentLetter = next;

    letter.textContent =
        currentLetter;


    feedback.textContent = "";

    feedback.className = "";


    resetLetter();
}


/* =========================================
   RESET LETTER
========================================= */

function resetLetter() {

    /*
       Return the letter to the
       right-side panel.
    */

    if (
        letter.parentElement !== panel
    ) {

        panel.insertBefore(
            letter,
            feedback
        );

    }


    letter.style.position =
        "relative";

    letter.style.left =
        "0px";

    letter.style.top =
        "0px";

    letter.style.width =
        "";

    letter.style.height =
        "";
}


/* =========================================
   START DRAG
========================================= */

letter.addEventListener(
    "pointerdown",
    startDrag
);


function startDrag(e) {

    e.preventDefault();


    dragging = true;


    letter.classList.add(
        "dragging"
    );


    const rect =
        letter.getBoundingClientRect();


    offsetX =
        e.clientX - rect.left;

    offsetY =
        e.clientY - rect.top;


    /*
       Move the letter to BODY while
       dragging so it can cross from
       the right panel onto the paper.
    */

    document.body.appendChild(
        letter
    );


    letter.style.position =
        "fixed";

    letter.style.width =
        rect.width + "px";

    letter.style.height =
        rect.height + "px";


    moveLetter(
        e.clientX,
        e.clientY
    );


    try {

        letter.setPointerCapture(
            e.pointerId
        );

    }
    catch(error) {}

}


/* =========================================
   DRAG
========================================= */

letter.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging) {
            return;
        }


        e.preventDefault();


        moveLetter(
            e.clientX,
            e.clientY
        );

    }
);


function moveLetter(x, y) {

    letter.style.left =
        (x - offsetX) + "px";

    letter.style.top =
        (y - offsetY) + "px";
}


/* =========================================
   RELEASE
========================================= */

letter.addEventListener(
    "pointerup",
    function(e) {

        if (!dragging) {
            return;
        }


        dragging = false;


        letter.classList.remove(
            "dragging"
        );


        checkAnswer();

    }
);


/* =========================================
   CHECK ANSWER
========================================= */

function checkAnswer() {

    const paperRect =
        paper.getBoundingClientRect();


    const letterRect =
        letter.getBoundingClientRect();


    /*
       Check that the letter was actually
       dropped over the writing paper.
    */

    const centerX =
        letterRect.left
        + letterRect.width / 2;


    const centerY =
        letterRect.top
        + letterRect.height / 2;


    const insidePaper =

        centerX >= paperRect.left &&

        centerX <= paperRect.right &&

        centerY >= paperRect.top &&

        centerY <= paperRect.bottom;


    if (!insidePaper) {

        wrongAnswer();

        return;
    }


    /*
       Get the TOP and BOTTOM of the
       draggable letter relative to
       the writing paper.
    */

    const relativeTop =
        letterRect.top
        - paperRect.top;


    const relativeBottom =
        letterRect.bottom
        - paperRect.top;


    const relativeCenter =
        centerY
        - paperRect.top;


    /*
       Actual line positions.

       Paper:
           top line       = 60
           small top      = 200
           baseline       = 315
    */

    const smallTop = 200;

    const baseline = 315;


    /*
       Give children a generous tolerance.
       They do NOT need pixel-perfect
       placement.
    */

    const tolerance = 45;


    let correct = false;


    /* =====================================
       SMALL LETTER

       Main letter should be located
       inside the yellow area.
    ====================================== */

    if (
        smallLetters.includes(
            currentLetter
        )
    ) {

        correct =

            relativeCenter >
                smallTop - 20

            &&

            relativeCenter <
                baseline + 10;

    }


    /* =====================================
       TALL LETTER

       Letter should extend ABOVE
       the yellow small-letter area.

       Bottom should still be near
       the baseline.
    ====================================== */

    else if (
        tallLetters.includes(
            currentLetter
        )
    ) {

        const extendsUp =
            relativeTop <
            smallTop + 20;


        const nearBaseline =
            relativeBottom >
                baseline - tolerance

            &&

            relativeBottom <
                baseline + tolerance;


        correct =
            extendsUp &&
            nearBaseline;

    }


    /* =====================================
       FALL LETTER

       IMPORTANT:

       The BODY belongs in the yellow
       SMALL area.

       The descender goes BELOW the
       yellow baseline.

       Therefore the letter must span
       BOTH areas.
    ====================================== */

    else if (
        fallLetters.includes(
            currentLetter
        )
    ) {

        const bodyInSmallArea =
            relativeTop <
            baseline - 25;


        const descenderBelowBaseline =
            relativeBottom >
            baseline + 25;


        const notTooHigh =
            relativeTop >
            smallTop - tolerance;


        correct =

            bodyInSmallArea

            &&

            descenderBelowBaseline

            &&

            notTooHigh;

    }


    if (correct) {

        correctAnswer();

    }

    else {

        wrongAnswer();

    }

}


/* =========================================
   CORRECT ANSWER
========================================= */

function correctAnswer() {

    feedback.textContent =
        "Great job! ✓";


    feedback.className =
        "correct";


    playDing();

    celebrate();


    setTimeout(
        newLetter,
        1400
    );
}


/* =========================================
   WRONG ANSWER
========================================= */

function wrongAnswer() {

    feedback.textContent =
        "Try again!";


    feedback.className =
        "wrong";


    setTimeout(
        resetLetter,
        500
    );
}


/* =========================================
   DING SOUND
========================================= */

function playDing() {

    try {

        const AudioContext =
            window.AudioContext
            ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.type =
            "sine";


        oscillator.frequency
            .setValueAtTime(
                660,
                ctx.currentTime
            );


        oscillator.frequency
            .exponentialRampToValueAtTime(
                880,
                ctx.currentTime + .18
            );


        gain.gain
            .setValueAtTime(
                .18,
                ctx.currentTime
            );


        gain.gain
            .exponentialRampToValueAtTime(
                .001,
                ctx.currentTime + .45
            );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime + .45
        );

    }

    catch(error) {

        console.log(
            "Audio unavailable"
        );

    }
}


/* =========================================
   CELEBRATION
========================================= */

function celebrate() {

    const colors = [
        "#f2c94c",
        "#9bc8b5",
        "#e6a99b",
        "#aebddd",
        "#d5b6d8"
    ];


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random()
            * window.innerWidth
            + "px";


        piece.style.top =
            "-10px";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        piece.style.animationDelay =
            Math.random()
            * .25
            + "s";


        document.body.appendChild(
            piece
        );


        setTimeout(
            function() {

                piece.remove();

            },
            1600
        );

    }
}


/* =========================================
   START
========================================= */

newLetter();

</script>

</body>
</html>
