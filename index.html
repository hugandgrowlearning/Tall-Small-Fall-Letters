<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Tall, Small & Fall Letters</title>

<style>
/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        "Trebuchet MS",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

    background: #fbfaf6;
    color: #173d72;
}

.page {
    width: min(1500px, 97%);
    margin: 0 auto;
    padding: 18px 0 30px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: grid;
    grid-template-columns: 250px 1fr 250px;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
}

.grow-box {
    display: flex;
    align-items: center;
    gap: 15px;
    padding-left: 10px;
}

.sun {
    position: relative;
    width: 78px;
    height: 78px;
    flex: 0 0 auto;

    border-radius: 50%;
    background: #ffd43b;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 39px;
}

.grow-text {
    font-size: 21px;
    line-height: 1.15;
    font-weight: 700;
    color: #173d72;
}

.heart {
    color: #ff7c91;
}

.title-box {
    background: #fff5d7;
    border-radius: 38px;
    padding: 14px 25px 17px;
    text-align: center;
}

.title-box h1 {
    margin: 0;

    font-size: clamp(35px, 4vw, 60px);
    line-height: 1;

    color: #123d76;
    letter-spacing: 1px;
}

.title-box p {
    margin: 10px 0 0;

    font-size: clamp(16px, 1.7vw, 25px);
    color: #44556d;
}

.header-space {
    min-height: 1px;
}


/* =========================================================
   GAME LAYOUT
========================================================= */

.game {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 20px;
}


/* =========================================================
   PAPER
========================================================= */

.paper-card {
    position: relative;

    min-height: 700px;

    background: white;

    border: 9px solid #eeeeec;
    border-radius: 35px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.06);

    overflow: hidden;
}


/*
   The actual writing area.
*/

#paper {
    position: absolute;

    left: 120px;
    right: 30px;

    top: 65px;
    bottom: 65px;

    touch-action: none;
}


/* =========================================================
   WRITING LINES

   Positions are percentages so the game scales.
========================================================= */

/*
   TOP LINE
   Tall letters reach this line.
*/

.top-line {
    position: absolute;

    left: 0;
    right: 0;

    top: 5%;

    height: 4px;

    background: #8d949b;

    border-radius: 5px;
}


/*
   DOTTED LINE
   Small + fall letters start here.
*/

.dotted-line {
    position: absolute;

    left: 0;
    right: 0;

    top: 36%;

    height: 4px;

    background:
        repeating-linear-gradient(
            to right,
            #858b92 0px,
            #858b92 18px,
            transparent 18px,
            transparent 36px
        );

    z-index: 3;
}


/*
   YELLOW SMALL AREA

   From dotted line to baseline.
*/

.small-zone {
    position: absolute;

    left: 0;
    right: 0;

    top: 36%;
    height: 28%;

    background:
        linear-gradient(
            90deg,
            rgba(255,235,145,.55),
            rgba(255,241,175,.70),
            rgba(255,235,145,.55)
        );

    z-index: 1;
}


/*
   YELLOW BASELINE
*/

.baseline {
    position: absolute;

    left: 0;
    right: 0;

    top: 64%;

    height: 6px;

    background: #ffc400;

    border-radius: 5px;

    z-index: 4;
}


/*
   FALL LINE

   Intentionally faded/light.
*/

.fall-line {
    position: absolute;

    left: 0;
    right: 0;

    top: 89%;

    height: 4px;

    background: #dfe2e4;

    border-radius: 5px;

    z-index: 2;
}


/* =========================================================
   LINE LABELS
========================================================= */

.line-label {
    position: absolute;

    right: calc(100% + 15px);

    width: 105px;

    text-align: right;

    font-size: 17px;
    font-weight: 600;

    color: #68717d;

    transform: translateY(-50%);

    pointer-events: none;
}

.top-label {
    top: 5%;
}

.dotted-label {
    top: 36%;
}

.baseline-label {
    top: 64%;
}

.fall-label {
    top: 89%;

    color: #c8cdd1;
}


/* =========================================================
   LITTLE PENCIL MESSAGE
========================================================= */

.pencil-message {
    position: absolute;

    left: 35px;
    bottom: 25px;

    display: flex;
    align-items: center;
    gap: 14px;

    color: #173d72;

    font-size: 18px;
    font-style: italic;

    pointer-events: none;
}

.pencil {
    font-size: 47px;

    transform: rotate(-10deg);
}


/* =========================================================
   RIGHT PANEL
========================================================= */

.letter-panel {
    min-height: 700px;

    border: 3px solid #cbeafa;
    border-radius: 35px;

    background:
        linear-gradient(
            135deg,
            #f1fbff,
            #e8f7ff
        );

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 35px 20px 30px;
}

.letter-panel h2 {
    margin: 0;

    font-size: 29px;
    color: #173d72;
}


/* =========================================================
   LETTER STARTING AREA
========================================================= */

.letter-home {
    flex: 1;

    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 400px;
}


/*
   IMPORTANT:
   No white box.
   The student sees only the letter.
*/

#letter {
    display: inline-block;

    position: relative;

    margin: 0;
    padding: 0;

    background: transparent;
    border: none;
    box-shadow: none;

    color: #151515;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-weight: 700;

    /*
       This gets changed automatically
       depending on tall/small/fall.
    */

    font-size: 190px;

    line-height: 1;

    cursor: grab;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    transform-origin: center center;

    z-index: 100;
}

#letter:hover {
    transform: scale(1.03);
}

#letter.dragging {
    cursor: grabbing;

    opacity: .88;

    transform: scale(1.04);

    z-index: 9999;
}


/* =========================================================
   FEEDBACK
========================================================= */

#feedback {
    height: 45px;

    font-size: 24px;
    font-weight: 700;

    display: flex;
    justify-content: center;
    align-items: center;
}

.correct {
    color: #4b9868;
}

.wrong {
    color: #dc756a;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    display: flex;
    gap: 14px;

    margin-top: 10px;
}

button {
    border: none;

    padding: 15px 24px;

    border-radius: 17px;

    color: white;

    font-family: inherit;
    font-size: 18px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .1s ease,
        filter .1s ease;
}

button:hover {
    filter: brightness(1.04);
}

button:active {
    transform: translateY(3px);
}

.new-button {
    background: #159ce0;

    box-shadow:
        0 5px 0 #0782c3;
}

.reset-button {
    background: #8653ca;

    box-shadow:
        0 5px 0 #6e3eaf;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {
    position: fixed;

    width: 10px;
    height: 10px;

    border-radius: 3px;

    pointer-events: none;

    z-index: 99999;

    animation:
        confettiFall 1.3s ease-out forwards;
}

@keyframes confettiFall {

    0% {
        transform:
            translateY(-30px)
            rotate(0deg);

        opacity: 1;
    }

    100% {
        transform:
            translateY(450px)
            rotate(500deg);

        opacity: 0;
    }
}


/* =========================================================
   TABLET / MOBILE
========================================================= */

@media (max-width: 900px) {

    .header {
        grid-template-columns: 1fr;
    }

    .grow-box {
        display: none;
    }

    .header-space {
        display: none;
    }

    .game {
        grid-template-columns: 1fr;
    }

    .paper-card {
        min-height: 570px;
    }

    #paper {
        left: 95px;
        right: 20px;
        top: 45px;
        bottom: 55px;
    }

    .line-label {
        width: 80px;

        font-size: 13px;
    }

    .letter-panel {
        min-height: 300px;
    }

    .letter-home {
        min-height: 170px;
    }

    #letter {
        font-size: 150px;
    }

    .pencil-message {
        font-size: 14px;
    }
}


/* Very small phones */

@media (max-width: 520px) {

    .page {
        width: 98%;
    }

    .title-box {
        border-radius: 25px;
    }

    .title-box h1 {
        font-size: 30px;
    }

    .paper-card {
        min-height: 470px;
    }

    #paper {
        left: 70px;
    }

    .line-label {
        width: 60px;
        font-size: 10px;
    }

    .pencil-message {
        display: none;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <div class="header">

        <div class="grow-box">

            <div class="sun">
                ☺
            </div>

            <div class="grow-text">
                Good<br>
                Writers<br>
                Grow Here!
                <span class="heart">♥</span>
            </div>

        </div>


        <div class="title-box">

            <h1>
                Tall, Small &amp; Fall Letters
            </h1>

            <p>
                Drag the letter to the correct place on the writing paper.
            </p>

        </div>


        <div class="header-space"></div>

    </div>



    <!-- ===================================================
         GAME
    ==================================================== -->

    <div class="game">


        <!-- ===============================================
             WRITING PAPER
        ================================================ -->

        <div class="paper-card">


            <div id="paper">


                <!-- TOP -->

                <div class="top-line"></div>

                <div class="line-label top-label">
                    Top line
                </div>


                <!-- SMALL AREA -->

                <div class="small-zone"></div>


                <!-- DOTTED -->

                <div class="dotted-line"></div>

                <div class="line-label dotted-label">
                    Dotted line
                </div>


                <!-- BASELINE -->

                <div class="baseline"></div>

                <div class="line-label baseline-label">
                    Baseline
                </div>


                <!-- FALL -->

                <div class="fall-line"></div>

                <div class="line-label fall-label">
                    Fall line
                </div>


            </div>


            <div class="pencil-message">

                <div class="pencil">
                    ✏️
                </div>

                <div>
                    Let's build<br>
                    better handwriting!
                    <span class="heart">♥</span>
                </div>

            </div>


        </div>



        <!-- ===============================================
             LETTER PANEL
        ================================================ -->

        <div class="letter-panel">

            <h2>
                Drag this letter:
            </h2>


            <div class="letter-home" id="letterHome">

                <div id="letter">
                    a
                </div>

            </div>


            <div id="feedback"></div>


            <div class="buttons">

                <button
                    class="new-button"
                    onclick="newLetter()">

                    New Letter

                </button>


                <button
                    class="reset-button"
                    onclick="resetLetter()">

                    Reset

                </button>

            </div>

        </div>


    </div>

</div>



<script>

/* =========================================================
   LETTER GROUPS
========================================================= */

/*
   Tall letters:
   top line → baseline
*/

const tallLetters = [
    "b",
    "d",
    "f",
    "h",
    "k",
    "l",
    "t"
];


/*
   Small letters:
   dotted line → baseline
*/

const smallLetters = [
    "a",
    "c",
    "e",
    "i",
    "m",
    "n",
    "o",
    "r",
    "s",
    "u",
    "v",
    "w",
    "x",
    "z"
];


/*
   Fall letters:
   dotted line → below baseline
*/

const fallLetters = [
    "g",
    "j",
    "p",
    "q",
    "y"
];


const allLetters = [
    ...tallLetters,
    ...smallLetters,
    ...fallLetters
];



/* =========================================================
   ELEMENTS
========================================================= */

const letter =
    document.getElementById("letter");

const letterHome =
    document.getElementById("letterHome");

const paper =
    document.getElementById("paper");

const feedback =
    document.getElementById("feedback");


let currentLetter = "a";

let dragging = false;

let offsetX = 0;
let offsetY = 0;



/* =========================================================
   DETERMINE TYPE
========================================================= */

function getLetterType(character) {

    if (
        tallLetters.includes(character)
    ) {
        return "tall";
    }


    if (
        fallLetters.includes(character)
    ) {
        return "fall";
    }


    return "small";
}



/* =========================================================
   SIZE THE LETTER

   These sizes are deliberately LARGE.

   Small:
       dotted → baseline

   Tall:
       top → baseline

   Fall:
       dotted → below baseline
========================================================= */

function sizeLetter() {

    const type =
        getLetterType(currentLetter);


    /*
       The font sizes are different because
       lowercase font shapes do not occupy
       the entire CSS font box.
    */

    if (type === "small") {

        letter.style.fontSize =
            "190px";

    }

    else if (type === "tall") {

        letter.style.fontSize =
            "285px";

    }

    else {

        /*
           Fall letters need enough size
           for both the body and descender.
        */

        letter.style.fontSize =
            "220px";

    }
}



/* =========================================================
   NEW RANDOM LETTER
========================================================= */

function newLetter() {

    let next;


    do {

        next =
            allLetters[
                Math.floor(
                    Math.random()
                    * allLetters.length
                )
            ];

    }
    while (
        next === currentLetter
    );


    currentLetter = next;


    letter.textContent =
        currentLetter;


    feedback.textContent = "";

    feedback.className = "";


    resetLetter();


    sizeLetter();
}



/* =========================================================
   RESET
========================================================= */

function resetLetter() {

    if (
        letter.parentElement
        !== letterHome
    ) {

        letterHome.appendChild(
            letter
        );
    }


    letter.style.position =
        "relative";

    letter.style.left =
        "0px";

    letter.style.top =
        "0px";

    letter.style.width =
        "";

    letter.style.height =
        "";


    feedback.textContent = "";

    feedback.className = "";


    sizeLetter();
}



/* =========================================================
   START DRAG
========================================================= */

letter.addEventListener(
    "pointerdown",
    startDrag
);


function startDrag(e) {

    e.preventDefault();


    dragging = true;


    letter.classList.add(
        "dragging"
    );


    const rect =
        letter.getBoundingClientRect();


    offsetX =
        e.clientX - rect.left;

    offsetY =
        e.clientY - rect.top;


    /*
       Move letter to body while dragging.
    */

    document.body.appendChild(
        letter
    );


    letter.style.position =
        "fixed";

    letter.style.left =
        rect.left + "px";

    letter.style.top =
        rect.top + "px";

    letter.style.width =
        rect.width + "px";

    letter.style.height =
        rect.height + "px";


    try {

        letter.setPointerCapture(
            e.pointerId
        );

    }
    catch(error) {}

}



/* =========================================================
   DRAG
========================================================= */

letter.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging) {
            return;
        }


        e.preventDefault();


        letter.style.left =
            (
                e.clientX
                - offsetX
            )
            + "px";


        letter.style.top =
            (
                e.clientY
                - offsetY
            )
            + "px";

    }
);



/* =========================================================
   RELEASE
========================================================= */

letter.addEventListener(
    "pointerup",
    function(e) {

        if (!dragging) {
            return;
        }


        dragging = false;


        letter.classList.remove(
            "dragging"
        );


        checkAnswer();

    }
);



/* =========================================================
   CHECK ANSWER

   We check WHERE the student placed
   the letter vertically.

   The tolerances are intentionally
   generous for young students.
========================================================= */

function checkAnswer() {

    const paperRect =
        paper.getBoundingClientRect();


    const letterRect =
        letter.getBoundingClientRect();


    const centerX =
        letterRect.left
        + letterRect.width / 2;


    const centerY =
        letterRect.top
        + letterRect.height / 2;



    /*
       Must actually be over the paper.
    */

    const insidePaper =

        centerX >= paperRect.left

        &&

        centerX <= paperRect.right

        &&

        centerY >= paperRect.top

        &&

        centerY <= paperRect.bottom;


    if (!insidePaper) {

        wrongAnswer();

        return;
    }



    /*
       Get actual line coordinates
       from the current screen size.
    */

    const paperHeight =
        paperRect.height;


    const topLine =
        paperHeight * .05;


    const dottedLine =
        paperHeight * .36;


    const baseline =
        paperHeight * .64;


    const fallLine =
        paperHeight * .89;



    /*
       Where did the student place
       the letter?
    */

    const letterTop =
        letterRect.top
        - paperRect.top;


    const letterBottom =
        letterRect.bottom
        - paperRect.top;


    const type =
        getLetterType(currentLetter);



    /*
       Fairly generous tolerance.
    */

    const tolerance =
        paperHeight * .11;


    let correct = false;



    /* =====================================================
       SMALL

       Must live around:

       dotted line
           ↓
       baseline
    ===================================================== */

    if (type === "small") {

        const nearSmallArea =

            letterTop <
                dottedLine + tolerance

            &&

            letterBottom >
                baseline - tolerance

            &&

            letterTop >
                dottedLine - tolerance * 1.5

            &&

            letterBottom <
                baseline + tolerance * 1.5;


        correct =
            nearSmallArea;
    }



    /* =====================================================
       TALL

       Must span:

       top line
          ↓
       baseline
    ===================================================== */

    else if (type === "tall") {

        const reachesTop =

            letterTop <
            topLine + tolerance * 1.5;


        const reachesBaseline =

            letterBottom >
            baseline - tolerance;


        const notTooLow =

            letterBottom <
            baseline + tolerance * 1.5;


        correct =

            reachesTop

            &&

            reachesBaseline

            &&

            notTooLow;
    }



    /* =====================================================
       FALL

       Must start around dotted line,
       cross the baseline,
       and extend into fall area.

       It does NOT belong completely
       below the baseline.
    ===================================================== */

    else if (type === "fall") {

        const beginsAtSmallArea =

            letterTop >
                dottedLine
                - tolerance * 1.5

            &&

            letterTop <
                dottedLine
                + tolerance;


        const crossesBaseline =

            letterTop <
            baseline

            &&

            letterBottom >
            baseline;


        const reachesFallArea =

            letterBottom >
            baseline + 25;


        const notTooLow =

            letterBottom <
            fallLine + tolerance;


        correct =

            beginsAtSmallArea

            &&

            crossesBaseline

            &&

            reachesFallArea

            &&

            notTooLow;
    }



    if (correct) {

        correctAnswer();

    }

    else {

        wrongAnswer();

    }

}



/* =========================================================
   CORRECT
========================================================= */

function correctAnswer() {

    feedback.textContent =
        "Great job! ✓";


    feedback.className =
        "correct";


    playDing();

    celebrate();


    /*
       Wait briefly, then give
       another random letter.
    */

    setTimeout(
        newLetter,
        1400
    );
}



/* =========================================================
   TRY AGAIN
========================================================= */

function wrongAnswer() {

    feedback.textContent =
        "Try again!";


    feedback.className =
        "wrong";


    setTimeout(
        function() {

            resetLetter();

            feedback.textContent =
                "Try again!";

            feedback.className =
                "wrong";

        },
        450
    );
}



/* =========================================================
   SOUND

   No external audio file needed.
========================================================= */

function playDing() {

    try {

        const AudioContext =
            window.AudioContext
            ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.type =
            "sine";


        oscillator.frequency
            .setValueAtTime(
                650,
                ctx.currentTime
            );


        oscillator.frequency
            .exponentialRampToValueAtTime(
                900,
                ctx.currentTime + .18
            );


        gain.gain
            .setValueAtTime(
                .16,
                ctx.currentTime
            );


        gain.gain
            .exponentialRampToValueAtTime(
                .001,
                ctx.currentTime + .5
            );


        oscillator.start();


        oscillator.stop(
            ctx.currentTime + .5
        );

    }

    catch(error) {

        console.log(
            "Sound unavailable."
        );

    }
}



/* =========================================================
   CONFETTI
========================================================= */

function celebrate() {

    const colors = [
        "#ffc93c",
        "#82cdb0",
        "#ff91a6",
        "#78bde8",
        "#aa82dc"
    ];


    for (
        let i = 0;
        i < 32;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random()
            * window.innerWidth
            + "px";


        piece.style.top =
            "-10px";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        piece.style.animationDelay =
            Math.random()
            * .25
            + "s";


        document.body.appendChild(
            piece
        );


        setTimeout(
            function() {

                piece.remove();

            },
            1700
        );

    }
}



/* =========================================================
   START GAME
========================================================= */

newLetter();

</script>

</body>
</html>
