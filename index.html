<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Tall, Small & Fall Letters</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f5ef;
        color: #333;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        padding: 22px 20px 10px;
    }

    h1 {
        margin: 0;
        font-size: 32px;
        color: #3f3f3f;
    }

    .subtitle {
        margin-top: 7px;
        font-size: 17px;
        color: #777;
    }

    /* MAIN GAME AREA */

    .game {
        width: min(1100px, 95%);
        margin: 20px auto;
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 25px;
        align-items: stretch;
    }

    /* LEFT SIDE */

    .paper-card {
        background: white;
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    .instruction {
        text-align: center;
        font-size: 19px;
        font-weight: 600;
        margin-bottom: 22px;
    }

    /* WRITING PAPER */

    #paper {
        position: relative;
        width: 100%;
        height: 440px;
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        border: 3px solid #ece8df;
        touch-action: none;
    }

    /* top writing line */

    .top-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 70px;
        height: 3px;
        background: #c7c7c7;
    }

    /* dashed middle line */

    .middle-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 210px;
        border-top: 3px dashed #bcbcbc;
        z-index: 3;
    }

    /*
       SMALL LETTER AREA

       Between middle line and baseline.
    */

    .small-zone {
        position: absolute;
        left: 0;
        right: 0;
        top: 210px;
        height: 105px;
        background: rgba(255, 216, 74, .30);
        z-index: 1;
    }

    /* strong yellow baseline */

    .baseline {
        position: absolute;
        left: 0;
        right: 0;
        top: 315px;
        height: 6px;
        background: #f2c94c;
        z-index: 4;
    }

    /* subtle zone labels */

    .zone-label {
        position: absolute;
        left: 15px;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 1px;
        opacity: .28;
        pointer-events: none;
        z-index: 2;
    }

    .tall-label {
        top: 105px;
    }

    .small-label {
        top: 250px;
    }

    .fall-label {
        top: 360px;
    }

    /* RIGHT PANEL */

    .letter-panel {
        background: #e7f1ed;
        border-radius: 22px;
        padding: 25px 20px;
        box-shadow: 0 6px 18px rgba(0,0,0,.07);

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        min-height: 440px;
    }

    .letter-panel h2 {
        font-size: 18px;
        margin: 0 0 25px;
        color: #555;
    }

    /* draggable letter */

    #letter {
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
        font-size: 115px;
        line-height: 1;
        font-weight: bold;
        color: #444;

        cursor: grab;
        user-select: none;
        -webkit-user-select: none;

        touch-action: none;

        width: 150px;
        height: 160px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: white;
        border-radius: 22px;

        box-shadow:
            0 6px 0 #d5d0c7,
            0 10px 18px rgba(0,0,0,.10);

        transition:
            box-shadow .15s ease,
            transform .15s ease;
    }

    #letter:hover {
        transform: translateY(-2px);
    }

    #letter.dragging {
        cursor: grabbing;
        transform: scale(1.05);
        box-shadow:
            0 3px 0 #d5d0c7,
            0 12px 24px rgba(0,0,0,.18);
        z-index: 1000;
    }

    /* feedback */

    #feedback {
        margin-top: 24px;
        min-height: 35px;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
    }

    .correct {
        color: #4b8b68;
    }

    .wrong {
        color: #d27765;
    }

    /* BUTTONS */

    .buttons {
        width: min(1100px, 95%);
        margin: 0 auto 30px;

        display: flex;
        justify-content: center;
        gap: 14px;
    }

    button {
        border: none;
        border-radius: 14px;
        padding: 13px 24px;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        background: #f2c94c;
        color: #3d3d3d;

        box-shadow: 0 4px 0 #d5ac35;

        transition: transform .1s;
    }

    button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #d5ac35;
    }

    /* CONFETTI */

    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        pointer-events: none;
        z-index: 9999;

        animation: fall 1.2s ease-out forwards;
    }

    @keyframes fall {
        0% {
            transform: translateY(-20px) rotate(0deg);
            opacity: 1;
        }

        100% {
            transform: translateY(400px) rotate(500deg);
            opacity: 0;
        }
    }

    /* MOBILE / IPAD */

    @media (max-width: 760px) {

        h1 {
            font-size: 25px;
        }

        .game {
            grid-template-columns: 1fr;
        }

        .letter-panel {
            min-height: 220px;
        }

        #paper {
            height: 400px;
        }

        .top-line {
            top: 60px;
        }

        .middle-line {
            top: 190px;
        }

        .small-zone {
            top: 190px;
            height: 95px;
        }

        .baseline {
            top: 285px;
        }

        .tall-label {
            top: 100px;
        }

        .small-label {
            top: 225px;
        }

        .fall-label {
            top: 330px;
        }

        #letter {
            font-size: 95px;
            width: 130px;
            height: 130px;
        }
    }

</style>
</head>

<body>

<header>
    <h1>Tall, Small & Fall Letters</h1>
    <div class="subtitle">
        Where does the letter belong?
    </div>
</header>


<div class="game">

    <!-- WRITING PAPER -->

    <div class="paper-card">

        <div class="instruction">
            Drag the letter to the correct place on the writing paper.
        </div>

        <div id="paper">

            <div class="top-line"></div>

            <div class="small-zone"></div>

            <div class="middle-line"></div>

            <div class="baseline"></div>

            <div class="zone-label tall-label">
                TALL
            </div>

            <div class="zone-label small-label">
                SMALL
            </div>

            <div class="zone-label fall-label">
                FALL
            </div>

        </div>

    </div>


    <!-- LETTER -->

    <div class="letter-panel">

        <h2>Drag this letter</h2>

        <div id="letter">
            a
        </div>

        <div id="feedback"></div>

    </div>

</div>


<div class="buttons">

    <button onclick="newLetter()">
        New Letter
    </button>

    <button onclick="resetLetter()">
        Reset
    </button>

</div>


<script>

/* =========================================================
   LETTER GROUPS
   ========================================================= */

/*
   Tall:
   letters that extend above the small-letter area

   Small:
   letters that stay inside the yellow area

   Fall:
   letters with descenders below the baseline
*/

const tallLetters = [
    "b", "d", "f", "h", "k", "l", "t"
];

const smallLetters = [
    "a", "c", "e", "i", "m", "n",
    "o", "r", "s", "u", "v", "w",
    "x", "z"
];

const fallLetters = [
    "g", "j", "p", "q", "y"
];

const allLetters = [
    ...tallLetters,
    ...smallLetters,
    ...fallLetters
];


/* =========================================================
   ELEMENTS
   ========================================================= */

const letter = document.getElementById("letter");
const paper = document.getElementById("paper");
const feedback = document.getElementById("feedback");

let currentLetter = "a";

let dragging = false;

let offsetX = 0;
let offsetY = 0;

let startParent = null;


/* =========================================================
   RANDOM LETTER
   ========================================================= */

function newLetter() {

    let next;

    do {

        next =
            allLetters[
                Math.floor(
                    Math.random() * allLetters.length
                )
            ];

    } while (
        next === currentLetter &&
        allLetters.length > 1
    );

    currentLetter = next;

    letter.textContent = currentLetter;

    feedback.textContent = "";
    feedback.className = "";

    resetLetter();
}


/* =========================================================
   RESET LETTER
   ========================================================= */

function resetLetter() {

    const panel =
        document.querySelector(".letter-panel");

    letter.style.position = "relative";
    letter.style.left = "0px";
    letter.style.top = "0px";

    if (letter.parentElement !== panel) {
        panel.insertBefore(
            letter,
            feedback
        );
    }
}


/* =========================================================
   POINTER DOWN
   Works with mouse + touch + Apple Pencil
   ========================================================= */

letter.addEventListener(
    "pointerdown",
    startDrag
);


function startDrag(e) {

    e.preventDefault();

    dragging = true;

    letter.classList.add("dragging");

    const rect =
        letter.getBoundingClientRect();

    offsetX =
        e.clientX - rect.left;

    offsetY =
        e.clientY - rect.top;

    /*
       Move the letter to body so it can travel
       freely across both columns.
    */

    document.body.appendChild(letter);

    letter.style.position = "fixed";

    letter.style.width =
        rect.width + "px";

    letter.style.height =
        rect.height + "px";

    moveLetter(e.clientX, e.clientY);

    letter.setPointerCapture(e.pointerId);
}


/* =========================================================
   POINTER MOVE
   ========================================================= */

letter.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging) return;

        e.preventDefault();

        moveLetter(
            e.clientX,
            e.clientY
        );

    }
);


function moveLetter(x, y) {

    letter.style.left =
        (x - offsetX) + "px";

    letter.style.top =
        (y - offsetY) + "px";
}


/* =========================================================
   POINTER UP
   ========================================================= */

letter.addEventListener(
    "pointerup",
    function(e) {

        if (!dragging) return;

        dragging = false;

        letter.classList.remove(
            "dragging"
        );

        checkAnswer();

    }
);


/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer() {

    const paperRect =
        paper.getBoundingClientRect();

    const letterRect =
        letter.getBoundingClientRect();


    /*
       First check whether the CENTER
       of the letter is inside the paper.
    */

    const centerX =
        letterRect.left +
        letterRect.width / 2;

    const centerY =
        letterRect.top +
        letterRect.height / 2;


    const insidePaper =
        centerX >= paperRect.left &&
        centerX <= paperRect.right &&
        centerY >= paperRect.top &&
        centerY <= paperRect.bottom;


    if (!insidePaper) {

        wrongAnswer();
        return;

    }


    /*
       Convert letter center position
       to coordinates relative to paper.
    */

    const relativeY =
        centerY - paperRect.top;


    /*
       Zones based on desktop proportions.

       Tall center:
       roughly upper writing area

       Small center:
       yellow zone

       Fall center:
       lower writing area
    */

    const paperHeight =
        paperRect.height;


    /*
       Use proportional zones so it also
       works when the screen resizes.
    */

    const tallMax =
        paperHeight * 0.47;

    const smallMin =
        paperHeight * 0.47;

    const smallMax =
        paperHeight * 0.75;

    const fallMin =
        paperHeight * 0.67;


    let correct = false;


    /* TALL LETTER */

    if (
        tallLetters.includes(currentLetter)
    ) {

        if (
            relativeY < tallMax
        ) {

            correct = true;

        }

    }


    /* SMALL LETTER */

    else if (
        smallLetters.includes(currentLetter)
    ) {

        if (
            relativeY >= smallMin &&
            relativeY <= smallMax
        ) {

            correct = true;

        }

    }


    /* FALL LETTER */

    else if (
        fallLetters.includes(currentLetter)
    ) {

        if (
            relativeY >= fallMin
        ) {

            correct = true;

        }

    }


    if (correct) {

        correctAnswer();

    } else {

        wrongAnswer();

    }

}


/* =========================================================
   CORRECT
   ========================================================= */

function correctAnswer() {

    feedback.textContent =
        "Great job! ✓";

    feedback.className =
        "correct";

    playDing();

    celebrate();


    /*
       Automatically move to another
       letter after a short celebration.
    */

    setTimeout(
        newLetter,
        1300
    );

}


/* =========================================================
   WRONG
   ========================================================= */

function wrongAnswer() {

    feedback.textContent =
        "Try again!";

    feedback.className =
        "wrong";


    /*
       Give student enough time to see
       the feedback before returning.
    */

    setTimeout(
        function() {

            resetLetter();

        },
        450
    );

}


/* =========================================================
   DING SOUND
   Uses Web Audio API so no external audio file is needed.
   ========================================================= */

function playDing() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            660,
            ctx.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            880,
            ctx.currentTime + .18
        );

        gain.gain.setValueAtTime(
            .18,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .45
        );

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .45
        );

    } catch (err) {

        console.log(
            "Audio unavailable."
        );

    }

}


/* =========================================================
   CONFETTI
   ========================================================= */

function celebrate() {

    const colors = [
        "#f2c94c",
        "#9bc8b5",
        "#e6a99b",
        "#aebddd",
        "#d5b6d8"
    ];


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";

        piece.style.left =
            Math.random() *
            window.innerWidth +
            "px";

        piece.style.top =
            "-10px";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        piece.style.animationDelay =
            Math.random() *
            .25 +
            "s";

        document.body.appendChild(
            piece
        );


        setTimeout(
            function() {

                piece.remove();

            },
            1600
        );

    }

}


/* =========================================================
   START GAME
   ========================================================= */

newLetter();

</script>

</body>
</html>
